schema_version: 1

context:
  name: mistral-common
  version: "1.13.0"
  # Upstream 1.13 requires Python >=3.11,<3.16.
  python_min: "3.11"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/mistral_common-${{ version }}.tar.gz
  sha256: 8559b6e22e9b15d4d7445ae34db6d27578f3a6c0e3d74c5fd57b4bf2db543333

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
    - wheel
  run:
    - click >=8.1.0
    - fastapi >=0.118.3
    - jsonschema >=4.21.1
    # Upstream caps numpy <2.4 on Python <=3.12; noarch metadata cannot express the marker, so cap for all.
    - numpy >=1.25,<2.4
    - pillow >=10.3.0
    - pydantic >=2.12,<3.0
    - pydantic-extra-types >=2.10.5
    - pydantic-settings >=2.9.1
    - pycountry
    - python >=${{ python_min }},<3.16
    - requests >=2.0.0
    - sentencepiece >=0.2.0
    - setuptools
    - tiktoken >=0.7.0
    - typing-extensions >=4.11.0
    - uvicorn

tests:
  - script:
      - pip check
      - python -c "import mistral_common"
      - mistral_common --help
      - python run_test.py
    files:
      recipe:
        - run_test.py
    requirements:
      run:
        - pip
        - python ${{ python_min }}.*

about:
  homepage: https://github.com/mistralai/mistral-common
  repository: https://github.com/mistralai/mistral-common
  summary: Set of tools to help you work with Mistral models
  license: Apache-2.0
  license_file: LICENCE

extra:
  recipe-maintainers:
    - jeongseok-meta
